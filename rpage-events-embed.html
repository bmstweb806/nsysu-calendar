<!--
  國立中山大學活動日程｜RPage 直接嵌入版
  整份內容直接貼進 RPage 的 HTML 原始碼編輯區。
  本檔自帶 CSS + HTML + JavaScript，無 iframe、無頁面標題。
  須允許 <style>、<script> 與跨網域 fetch。
-->
<style>
#nsysu-calendar-embed {
  --calendar-blue: #174f72;
  --calendar-line: #dce5ed;
  --calendar-ink: #273845;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  color: var(--calendar-ink);
  font: 16px/1.7 Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
#nsysu-calendar-embed,
#nsysu-calendar-embed * { box-sizing: border-box; }
#nsysu-calendar-embed .calendar-filters {
  display: grid;
  grid-template-columns: minmax(220px, 1.7fr) minmax(160px, 1fr) minmax(160px, 1fr);
  gap: 12px;
  margin: 0 0 12px;
}
#nsysu-calendar-embed label {
  display: block;
  margin: 0 0 4px;
  font-size: 14px;
  font-weight: 700;
}
#nsysu-calendar-embed input,
#nsysu-calendar-embed select,
#nsysu-calendar-embed button {
  font: inherit;
}
#nsysu-calendar-embed input,
#nsysu-calendar-embed select {
  width: 100%;
  min-height: 44px;
  padding: 8px 10px;
  color: inherit;
  background: #fff;
  border: 1px solid #b8c8d3;
  border-radius: 0;
}
#nsysu-calendar-embed input:focus-visible,
#nsysu-calendar-embed select:focus-visible,
#nsysu-calendar-embed button:focus-visible {
  outline: 3px solid #8ac4e6;
  outline-offset: 2px;
}
#nsysu-calendar-embed .calendar-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin: 0 0 12px;
}
#nsysu-calendar-embed .calendar-count {
  font-size: 14px;
  color: #526879;
}

#nsysu-calendar-embed .calendar-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}
#nsysu-calendar-embed .calendar-language-switch {
  display: inline-flex;
  border: 1px solid #174f72;
  border-radius: 0;
  overflow: hidden;
}
#nsysu-calendar-embed .calendar-language-switch button {
  padding: 7px 13px;
  min-width: 64px;
  border: 0;
  border-radius: 0;
  background: #fff;
  color: #174f72;
  cursor: pointer;
  font-weight: 700;
}
#nsysu-calendar-embed .calendar-language-switch button + button {
  border-left: 1px solid #174f72;
}
#nsysu-calendar-embed .calendar-language-switch button[aria-pressed="true"] {
  background: #174f72;
  color: #fff;
}
#nsysu-calendar-embed .calendar-language-switch button:hover:not([aria-pressed="true"]) {
  background: #e9f1f6;
}
#nsysu-calendar-embed .calendar-reset {
  padding: 7px 14px;
  color: var(--calendar-blue);
  background: #fff;
  border: 1px solid #aec3d2;
  border-radius: 0;
  cursor: pointer;
}
#nsysu-calendar-embed .calendar-table-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
#nsysu-calendar-embed table {
  width: 100%;
  min-width: 1160px;
  table-layout: fixed;
  border-collapse: collapse;
  font-size: 14px;
  line-height: 1.55;
}
#nsysu-calendar-embed th,
#nsysu-calendar-embed td {
  padding: 12px 10px;
  border: 1px solid var(--calendar-line);
  text-align: left;
  vertical-align: middle;
  overflow-wrap: break-word;
}
#nsysu-calendar-embed th {
  background: #e9f1f6;
  color: #173e58;
  font-weight: 700;
  white-space: nowrap;
}
#nsysu-calendar-embed tbody tr:nth-child(even) { background: #f8fafc; }
/* 兩個標籤欄給固定比例，不讓長活動名稱把它們擠成直排。 */
#nsysu-calendar-embed th:nth-child(1) { width: 12%; }
#nsysu-calendar-embed th:nth-child(2) { width: 9%; }
#nsysu-calendar-embed th:nth-child(3) { width: 16%; }
#nsysu-calendar-embed th:nth-child(4) { width: 11%; }
#nsysu-calendar-embed th:nth-child(5) { width: 25%; }
#nsysu-calendar-embed th:nth-child(6) { width: 13%; }
#nsysu-calendar-embed th:nth-child(7) { width: 14%; }
#nsysu-calendar-embed td:first-child,
#nsysu-calendar-embed td:nth-child(2) {
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
#nsysu-calendar-embed a { color: #12608c; }

/* 簡潔標籤：對象＝細邊框＋年級代碼；類別＝低彩度色塊＋符號。 */
#nsysu-calendar-embed .calendar-chip {
  display: inline-flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  min-height: 29px;
  padding: 4px 7px;
  border-radius: 0;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.45;
  white-space: nowrap;
  vertical-align: middle;
}
#nsysu-calendar-embed .calendar-chip-code {
  flex: none;
  padding-right: 6px;
  border-right: 1px solid currentColor;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .02em;
  line-height: 1.25;
  font-variant-numeric: tabular-nums;
}
#nsysu-calendar-embed .calendar-chip-label {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
#nsysu-calendar-embed .calendar-audience {
  --tag-accent: #356783;
  color: #344d60;
  background: #fff;
  border: 1px solid #d0dbe4;
  border-left: 3px solid var(--tag-accent);
}
#nsysu-calendar-embed .calendar-audience[data-group="all"] { --tag-accent: #237260; }
#nsysu-calendar-embed .calendar-audience[data-group="y1"] { --tag-accent: #356d9d; }
#nsysu-calendar-embed .calendar-audience[data-group="y2"] { --tag-accent: #765ca0; }
#nsysu-calendar-embed .calendar-audience[data-group="y3"] { --tag-accent: #a0743b; }
#nsysu-calendar-embed .calendar-audience[data-group="y4"] { --tag-accent: #a65870; }
#nsysu-calendar-embed .calendar-audience[data-group="faculty"] { --tag-accent: #466b75; }
#nsysu-calendar-embed .calendar-category {
  width: 100%;
  max-width: 112px;
  min-height: 32px;
  justify-content: flex-start;
  color: #fff;
  background: #64748b;
  border: 1px solid transparent;
  font-weight: 600;
}
#nsysu-calendar-embed .calendar-category .calendar-chip-code {
  display: inline-flex;
  flex: 0 0 20px;
  width: 20px;
  min-width: 20px;
  height: 18px;
  padding: 0 5px 0 0;
  align-items: center;
  justify-content: center;
  border-right: 1px solid rgba(255,255,255,.45);
  font-size: 13px;
  line-height: 1;
}
#nsysu-calendar-embed .calendar-category .calendar-chip-label {
  flex: 1;
  text-align: left;
}
#nsysu-calendar-embed .calendar-category[data-group="event"] { background: #316c8e; }
#nsysu-calendar-embed .calendar-category[data-group="course"] { background: #42745d; }
#nsysu-calendar-embed .calendar-category[data-group="support"] { background: #976b4c; }
#nsysu-calendar-embed .calendar-category[data-group="other"] { background: #657386; }
#nsysu-calendar-embed .calendar-empty {
  text-align: center;
  padding: 26px 12px;
  color: #64798a;
}
@media (max-width: 900px) {
  #nsysu-calendar-embed .calendar-filters { grid-template-columns: 1fr 1fr; }
  #nsysu-calendar-embed .calendar-search { grid-column: 1 / -1; }
  #nsysu-calendar-embed .calendar-table-wrap { overflow: visible; }
  #nsysu-calendar-embed table { min-width: 0; table-layout: auto; font-size: 14px; }
  #nsysu-calendar-embed table,
  #nsysu-calendar-embed tbody,
  #nsysu-calendar-embed tr,
  #nsysu-calendar-embed td { display: block; width: 100%; }
  #nsysu-calendar-embed thead { display: none; }
  #nsysu-calendar-embed tbody { display: grid; gap: 12px; }
  #nsysu-calendar-embed tbody tr {
    padding: 12px;
    background: #fff !important;
    border: 1px solid var(--calendar-line);
    border-left: 4px solid var(--calendar-blue);
    border-radius: 0;
  }
  #nsysu-calendar-embed td {
    display: grid;
    grid-template-columns: 85px minmax(0, 1fr);
    gap: 12px;
    padding: 5px 0;
    border: 0;
  }
  #nsysu-calendar-embed td::before {
    content: attr(data-label);
    font-weight: 700;
    color: #47647a;
  }
}
</style>

<div id="nsysu-calendar-embed">
  <div class="calendar-filters">
    <div class="calendar-search">
      <label for="nsysu-calendar-q">搜尋活動</label>
      <input id="nsysu-calendar-q" type="search" placeholder="活動、地點、備註…">
    </div>
    <div>
      <label for="nsysu-calendar-audience">對象</label>
      <select id="nsysu-calendar-audience"><option value="">全部對象</option></select>
    </div>
    <div>
      <label for="nsysu-calendar-category">類別</label>
      <select id="nsysu-calendar-category"><option value="">全部類別</option></select>
    </div>
  </div>
  <div class="calendar-tools">
    <span id="nsysu-calendar-count" class="calendar-count" role="status" aria-live="polite">正在讀取活動資料…</span>

    <div class="calendar-actions">
      <div class="calendar-language-switch" role="group" aria-label="語言切換 / Language">
        <button id="nsysu-calendar-zh" type="button" lang="zh-Hant" aria-pressed="true">中文</button>
        <button id="nsysu-calendar-en" type="button" lang="en" aria-pressed="false">EN</button>
      </div>
      <button id="nsysu-calendar-reset" class="calendar-reset" type="button">清除篩選</button>
    </div>
  </div>
  <div class="calendar-table-wrap">
    <table aria-label="學系重要活動日程">
      <thead><tr>
        <th scope="col">活動日期</th><th scope="col">活動時間</th>
        <th scope="col">對象</th><th scope="col">類別</th>
        <th scope="col">活動項目</th><th scope="col">地點</th><th scope="col">備註</th>
      </tr></thead>
      <tbody id="nsysu-calendar-rows"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  "use strict";
  var root = document.getElementById("nsysu-calendar-embed");
  if (!root || root.dataset.initialized === "true") return;
  root.dataset.initialized = "true";
  var DATA_URL = "https://bmstweb806.github.io/nsysu-calendar/data/events.json";
  var fields = ["date", "time", "audience", "category", "title", "location", "notes"];
  var translations = {
    zh: {
      search: "搜尋活動", placeholder: "活動、地點、備註…", audience: "對象",
      category: "類別", allAudience: "全部對象",
      allCategory: "全部類別", clear: "清除篩選",
      loading: "正在讀取活動資料…", empty: "沒有符合篩選條件的活動",
      error: "活動資料讀取失敗：", count: function (n,total) { return "共 " + n + " 筆活動（總計 " + total + " 筆）"; },
      headers: ["活動日期","活動時間","對象","類別","活動項目","地點","備註"]
    },
    en: {
      search: "Search events", placeholder: "Event, venue, notes…", audience: "Audience",
      category: "Category", allAudience: "All audiences",
      allCategory: "All categories", clear: "Clear filters",
      loading: "Loading events…", empty: "No matching events",
      error: "Unable to load events: ", count: function (n,total) { return n + " events (total " + total + ")"; },
      headers: ["Date","Time","Audience","Category","Event","Venue","Notes"]
    }
  };
  var params = new URLSearchParams(window.location.search);
  var requestedLanguage = params.get("Lang") || params.get("lang") || "";
  var fallbackLanguage = document.documentElement.getAttribute("lang") || "";
  var language = /^en([_-]|$)/i.test(requestedLanguage || fallbackLanguage) ? "en" : "zh";
  var allEvents = [];
  var loaded = false;
  function node(id) { return root.querySelector("#nsysu-calendar-" + id); }
  function textFor(event, key) {
    if (language === "en" && ["audience","category","title","location","notes"].includes(key)) {
      var en = String(event[key + "_en"] || "").trim();
      if (en) return en;
    }
    return String(event[key] || "");
  }
  function labels() { return translations[language]; }
  function applyLanguage() {
    var t = labels();
    root.setAttribute("lang", language === "en" ? "en" : "zh-Hant");
    node("zh").setAttribute("aria-pressed",String(language === "zh"));
    node("en").setAttribute("aria-pressed",String(language === "en"));
    var pageHeading=document.getElementById("nsysu-calendar-page-heading");
    if(pageHeading) {
      pageHeading.textContent=language==="en"?"Department Events":"學系重要活動日程";
      document.documentElement.lang=language==="en"?"en":"zh-Hant";
    }
    root.querySelector('label[for="nsysu-calendar-q"]').textContent = t.search;
    node("q").placeholder = t.placeholder;
    root.querySelector('label[for="nsysu-calendar-audience"]').textContent = t.audience;
    root.querySelector('label[for="nsysu-calendar-category"]').textContent = t.category;
    node("reset").textContent = t.clear;
    var th = root.querySelectorAll("thead th");
    t.headers.forEach(function (h,i) { if (th[i]) th[i].textContent = h; });
    refreshOptions();
    if (loaded) render();
    else node("count").textContent = t.loading;
  }
  function dateText(value) {
    var s = String(value || "");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    var weekday = new Date(s + "T00:00:00Z").getUTCDay();
    var dayNames = language === "en" ? ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"] : ["日","一","二","三","四","五","六"];
    return s.replace(/-/g, "/") + " (" + dayNames[weekday] + ")";
  }
  function addOptions(id, items, allLabel) {
    var select=node(id), current=select.value;
    select.replaceChildren();
    var first=document.createElement("option");
    first.value=""; first.textContent=allLabel; select.appendChild(first);
    var values = Array.from(new Set(items.filter(Boolean)));
    values.sort(function (a, b) { return a.localeCompare(b, language === "en" ? "en" : "zh-Hant"); });
    values.forEach(function (value) {
      var option = document.createElement("option");
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    });
    if(values.includes(current))select.value=current;
  }
  function refreshOptions(){
    var t=labels();
    addOptions("audience",allEvents.map(function(e){return textFor(e,"audience");}),t.allAudience);
    addOptions("category",allEvents.map(function(e){return textFor(e,"category");}),t.allCategory);
  }

  function audienceTag(event) {
    var value=String(event.audience||"");
    if (/全系|全部|所有/.test(value))
      return {group:"all",code:"ALL",short:language==="en"?"All students":"全系"};
    var numbers=["一","二","三","四","五","六"];
    for (var i=0;i<numbers.length;i++) {
      if(value.includes(numbers[i]+"年級")) {
        return {
          group:i<4?"y"+(i+1):"other",
          code:"Y"+(i+1),
          short:language==="en"?"Year "+(i+1):numbers[i]+"年級"
        };
      }
    }
    if (/教師|教職/.test(value))
      return {group:"faculty",code:"FAC",short:language==="en"?"Faculty":"教師"};
    return {group:"other",code:"ETC",short:textFor(event,"audience")};
  }
  function categoryTag(event) {
    var raw=String(event.category||"");
    if(raw==="活動") return {group:"event",code:"◆",short:language==="en"?"Event":"活動"};
    if(raw==="課程") return {group:"course",code:"▤",short:language==="en"?"Course":"課程"};
    if(raw==="輔導") return {group:"support",code:"◎",short:language==="en"?"Support":"輔導"};
    if(raw==="其他") return {group:"other",code:"●",short:language==="en"?"Other":"其他"};
    return {group:"other",code:"●",short:textFor(event,"category")};
  }
  function addTag(cell,event,key) {
    var config=key==="audience"?audienceTag(event):categoryTag(event);
    var tag=document.createElement("span");
    tag.className="calendar-chip "+(key==="audience"?"calendar-audience":"calendar-category");
    tag.dataset.group=config.group;
    tag.title=textFor(event,key);
    tag.setAttribute("aria-label",textFor(event,key));
    var mark=document.createElement("span");
    mark.className="calendar-chip-code";
    mark.textContent=config.code;
    mark.setAttribute("aria-hidden","true");
    var label=document.createElement("span");
    label.className="calendar-chip-label";
    label.textContent=config.short;
    tag.append(mark,label);
    cell.replaceChildren(tag);
  }
  function render() {
    var term = node("q").value.trim().toLocaleLowerCase();
    var audience = node("audience").value;
    var category = node("category").value;
    // filter() 保留原始順序，不進行日期或 ID 排序。
    var shown = allEvents.filter(function (event) {
      return (!audience || textFor(event,"audience") === audience) &&
        (!category || textFor(event,"category") === category) &&
        (!term || fields.some(function (key) {
          return textFor(event,key).toLocaleLowerCase().includes(term);
        }));
    });
    node("count").textContent = labels().count(shown.length, allEvents.length);
    var body = node("rows");
    body.replaceChildren();
    if (!shown.length) {
      var emptyRow = document.createElement("tr");
      var emptyCell = document.createElement("td");
      emptyCell.colSpan = 7;
      emptyCell.className = "calendar-empty";
      emptyCell.textContent = labels().empty;
      emptyRow.appendChild(emptyCell);
      body.appendChild(emptyRow);
      return;
    }
    shown.forEach(function (event) {
      var row = document.createElement("tr");
      fields.forEach(function (key,i) {
        var cell = document.createElement("td");
        cell.setAttribute("data-label", labels().headers[i]);
        if (key === "audience" || key === "category") {
          addTag(cell,event,key);
        } else {
          cell.textContent = key === "date" ? dateText(event.date) : textFor(event,key);
        }
        if (key === "title" && /^https:\/\//i.test(String(event.url || ""))) {
          var anchor = document.createElement("a");
          anchor.href = event.url;
          anchor.target = "_blank";
          anchor.rel = "noopener noreferrer";
          anchor.textContent = textFor(event,"title") || (language==="en"?"Details":"查看活動");
          cell.replaceChildren(anchor);
        }
        row.appendChild(cell);
      });
      body.appendChild(row);
    });
  }
  ["q", "audience", "category"].forEach(function (id) {
    node(id).addEventListener(id === "q" ? "input" : "change", render);
  });
  node("reset").addEventListener("click", function () {
    ["q", "audience", "category"].forEach(function (id) { node(id).value = ""; });
    render();
  });
  function selectLanguage(nextLanguage) {
    if (language === nextLanguage) return;
    language = nextLanguage;
    // 避免原本中文的搜尋文字或篩選值影響英文結果（反之亦然）。
    ["q", "audience", "category"].forEach(function (id) { node(id).value = ""; });
    applyLanguage();
  }
  node("zh").addEventListener("click",function(){ selectLanguage("zh"); });
  node("en").addEventListener("click",function(){ selectLanguage("en"); });
  applyLanguage();
  fetch(DATA_URL, { cache: "no-cache" }).then(function (response) {
    if (!response.ok) throw new Error("HTTP " + response.status);
    return response.json();
  }).then(function (data) {
    if (!data || !Array.isArray(data.events)) throw new Error("JSON 格式不符");
    allEvents = data.events.filter(function (event) { return event && event.date && event.title; });
    loaded = true;
    applyLanguage();
  }).catch(function (error) {
    node("count").textContent = labels().error + error.message;
    node("rows").replaceChildren();
  });
}());
</script>
